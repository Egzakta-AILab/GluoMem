[project]
name = "gluomem"
version = "0.0.1"
description = "GluoMem — research-stage frame-codec memory library and benchmark harness for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Egzakta" }]
requires-python = ">=3.11"
# Core: config, SQLite storage, frames, hybrid search, KG, fake extractors and
# mock embeddings. Heavier capabilities are extras; see README "Installation".
dependencies = [
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "sqlite-vec",
    "numpy",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# DSPy extraction, answerer, judges and prompt optimization (OpenRouter calls).
llm = [
    "dspy==3.2.1",
]
# In-process sentence-transformers embedder and cross-encoder reranker
# (downloads models from Hugging Face on first use).
embeddings = [
    "sentence-transformers",
]
all = [
    "gluomem[llm,embeddings]",
]
# M5.5 head-to-head competitor: install with `uv sync --extra mem0`.
# Exact pin — the paper's manifest records this version; the offline gate
# must pass WITHOUT this extra (all mem0 imports are function-local).
# Vector store = qdrant local mode (qdrant-client ships in mem0ai core).
mem0 = [
    "mem0ai==2.0.11",
]

[project.scripts]
gluomem = "gluomem.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyrefly",
    "pre-commit>=4.6.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gluomem"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that download/load real models (excluded from the gate)",
]
addopts = "-m 'not slow'"

[tool.pyrefly]
project-excludes = [
    "**/.venv/**",
    "**/__pycache__/**",
    "**/.pytest_cache/**",
]
# mem0 is an optional extra absent from the gate env; its lazy imports type
# as Any so `make check` never needs `--extra mem0` installed.
replace-imports-with-any = ["mem0", "mem0.*"]
