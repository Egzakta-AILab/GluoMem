[project]
name = "gluomem"
version = "0.1.0"
description = "GluoMem — frame-codec memory library and benchmark harness for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Egzakta" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
]
llm = [
    "dspy>=3.4.1",
]
embeddings = [
    "sentence-transformers>=3.0",
]
tune = [
    "optuna>=4.0",
]
service = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "alembic>=1.14",
    "psycopg-pool>=3.2",
]
all = [
    "gluomem[postgres,llm,embeddings,tune,service]",
]

[project.scripts]
gluomem = "gluomem.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyrefly",
    "pre-commit>=4.6.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gluomem"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that download/load real models",
    "postgres: live PostgreSQL and pgvector contracts (GLUOMEM_TEST_PG_DSN)",
]
addopts = "-m 'not slow'"

[tool.pyrefly]
project-excludes = [
    "**/.venv/**",
    "**/__pycache__/**",
    "**/.pytest_cache/**",
]
replace-imports-with-any = [
    "alembic",
    "alembic.*",
    "fastapi",
    "fastapi.*",
    "httpx",
    "httpx.*",
    "mem0",
    "mem0.*",
    "optuna",
    "optuna.*",
    "pgvector",
    "pgvector.*",
    "psycopg",
    "psycopg.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "uvicorn",
    "uvicorn.*",
]
