[project]
name = "gluomem"
version = "0.0.1"
description = "GluoMem — the binding layer: deterministic frame-codec memory for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "sqlite-vec",
    "sentence-transformers",
    "onnxruntime",
    "numpy",
    "scipy",
    "dspy==3.2.1",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# M5.5 head-to-head competitor: install with `uv sync --extra mem0`.
# Exact pin — the paper's manifest records this version; the offline gate
# must pass WITHOUT this extra (all mem0 imports are function-local).
# Vector store = qdrant local mode (qdrant-client ships in mem0ai core).
mem0 = [
    "mem0ai==2.0.11",
]

[project.scripts]
gluomem = "gluomem.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyrefly",
    "pre-commit>=4.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gluomem"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that download/load real models (excluded from the gate)",
]
addopts = "-m 'not slow'"

[tool.pyrefly]
project-excludes = [
    "**/.venv/**",
    "**/__pycache__/**",
    "**/.pytest_cache/**",
]
# mem0 is an optional extra absent from the gate env; its lazy imports type
# as Any so `make check` never needs `--extra mem0` installed.
replace-imports-with-any = ["mem0", "mem0.*"]
