# GluoMem — full configuration surface.
# Every value below is config; nothing here is hardcoded in code.
# Precedence: defaults < this file < variant overlay < GLUOMEM_-prefixed env < with_overrides().

models:                          # registry
  mock:     {provider: inprocess, provider_model: mock, dim: null}              # deterministic offline fallback (loud banner via make_embedder)
  minilm:   {provider: inprocess, provider_model: sentence-transformers/all-MiniLM-L6-v2, dim: 384}
  ollama:   {provider: ollama,    provider_model: ollama/nomic-embed-text, dim: 768}
  reranker: {provider: onnx,      provider_model: cross-encoder/ms-marco-MiniLM-L-6-v2}
  # LLMs: ALL routed via OpenRouter (one gateway, one key). Routable slugs are
  # undated; per-experiment reproducibility pinning goes through
  # `extra: {extra_body: {provider: {...}}}` + recording the served version.
  haiku:    {provider: openrouter, provider_model: openrouter/anthropic/claude-haiku-4.5, api_key_env: OPENROUTER_API_KEY, cost_per_1k_in: 0.001, cost_per_1k_out: 0.005}
  sonnet:   {provider: openrouter, provider_model: openrouter/anthropic/claude-sonnet-4.6, api_key_env: OPENROUTER_API_KEY}
  gpt4o:    {provider: openrouter, provider_model: openrouter/openai/gpt-4o-2024-11-20, api_key_env: OPENROUTER_API_KEY}     # trio judge diversity
  # experiment matrix: answer/extraction backbones
  sonnet5:        {provider: openrouter, provider_model: openrouter/anthropic/claude-sonnet-5,   api_key_env: OPENROUTER_API_KEY, cost_per_1k_in: 0.002,    cost_per_1k_out: 0.010}
  gpt5-mini:      {provider: openrouter, provider_model: openrouter/openai/gpt-5.4-mini,         api_key_env: OPENROUTER_API_KEY, cost_per_1k_in: 0.00075,  cost_per_1k_out: 0.0045}
  qwen3:          {provider: openrouter, provider_model: openrouter/qwen/qwen3.6-27b,            api_key_env: OPENROUTER_API_KEY, cost_per_1k_in: 0.000285, cost_per_1k_out: 0.0024}
  deepseek-flash: {provider: openrouter, provider_model: openrouter/deepseek/deepseek-v4-flash,  api_key_env: OPENROUTER_API_KEY, cost_per_1k_in: 0.00009,  cost_per_1k_out: 0.00018}
  glm5:           {provider: openrouter, provider_model: openrouter/z-ai/glm-5.2,                api_key_env: OPENROUTER_API_KEY, cost_per_1k_in: 0.00091,  cost_per_1k_out: 0.00286}

storage:   {vector_backend: sqlite-vec, vector_dim: 384, path: ~/.gluomem/default.mind}   # exact KNN only
embedding: {model: minilm, pad_to: null}                                                # native dim, no pad
chunking:  {max_chars: 2000, overlap_chars: 200, min_chunk_chars: 1500, enabled: true}

search:
  rrf_k: 60
  lane_fetch_mult: 2
  lane_fetch_time_mult: 10
  rerank: {enabled: true, model: reranker, pool: 100}  # pool 100 pairs with benchmark.answer.context_k=50
  abstain: {enabled: true, threshold: 0.0}     # tune per corpus
  default_profile: balanced

scoring:
  half_life_days: 30
  flat_boost_days: 7
  log_coef: 0.1
  bfs_steps: [1.0, 0.7, 0.4, 0.2, 0.0]
  bfs_depth: 3
  importance_mult: {critical: 2.0, important: 1.5, normal: 1.0, temporary: 0.7, deprecated: 0.3}
  profiles:                                     # ablations flip these weights
    balanced:  {weights: {temporal: 0.4, popularity: 0.2, contextual: 0.2, importance: 0.2}}
    recent:    {weights: {temporal: 0.6, popularity: 0.1, contextual: 0.2, importance: 0.1}}
    important: {weights: {temporal: 0.1, popularity: 0.1, contextual: 0.2, importance: 0.6}}
    connected: {weights: {temporal: 0.1, popularity: 0.1, contextual: 0.6, importance: 0.2}}

kg:
  seed_min_len: 2
  bfs_symmetric: true
  alias_groups: [[postgresql,postgres,pg],[kubernetes,k8s]]
  tech_allowlist: [go,ai,ml,db,npm,k8s]
  entity_type_mode: retype                      # off | retype | drop  (retype: relabel unlisted types to retype_to; drop: prune those nodes and their relations)
  retype_to: other                              # label used when entity_type_mode=retype
  entity_type_allowlist: [person,organization,location,place,city,country,event,concept,object,activity,technology,product,group,animal,food,book,movie,artwork,game,project,skill,profession,vehicle,building]
  entity_type_prompt_enum: false                # render entity_type as a closed enum in the cognify schema — CHANGES EXTRACTION; needs a fresh extraction cache
  predicate_families: []                        # relation-type alias groups, e.g. [[LIVES_IN,MOVED_TO,RESIDES_IN]] — one functional predicate for retirement + kg_edge_conflict

safety:
  block_threshold: 0.7
  fail_mode: quarantine                         # quarantine: demote trust, still admit | reject: drop
  semantic_classifier: {enabled: false}
  scanner:                                      # cheap regex prompt-injection markers; weight in [0,1]
    patterns:
      - {regex: "(?i)ignore (all )?(previous|prior) (instructions|context)", weight: 1.0}
      - {regex: "(?i)disregard (all )?(previous|prior)", weight: 1.0}
      - {regex: "(?i)you are now (in )?(developer|dan) mode", weight: 1.0}
      - {regex: "(?i)system prompt", weight: 1.0}
      - {regex: "<\\|im_start\\|>", weight: 1.0}
      - {regex: "(?i)\\bBEGIN (ADMIN|SYSTEM)\\b", weight: 1.0}

write:
  frame_model: ipb                              # ipb | i_only | overwrite  (ablation knob)
  extraction_backend: dspy                      # dspy | fake | none (fake: deterministic offline; none: raw turns only)
  backdate_created_at: false                    # benchmark mode: decay anchor = session datetime, not ingest time
  parallelism: 16                               # within-session extraction fan-out (lanes + cognify); DB writes stay single-threaded
  max_concurrent_llm: 16                        # PROCESS-WIDE cap on simultaneous extraction calls (the real API throttle); raise toward rate limit
  conv_parallelism: 4                           # batch ingest: conversations ingested concurrently (independent .mind DBs); 1 = sequential
  raw_turns: {enabled: true, importance: temporary}
  lanes:                                        # distinct importance per lane at admission
    fact:    {enabled: true, importance: normal}
    event:   {enabled: true, importance: normal}
    profile: {enabled: true, importance: important}
  subject: {min_entity_overlap: 2, trigger: entity_overlap}  # P-frame same-subject threshold; trigger: entity_overlap | kg_edge_conflict | both (contradiction-candidate nomination)
  cognify: {enabled: true, retire_conflicting_edges: true}
  dedup: {mode: exact, similarity_threshold: 0.92, lanes: [fact, profile], on_hit: drop}  # mode: exact | semantic; on_hit: drop | keep_longest (longer restatement supersedes)
  extraction_cache: {mode: "off", path: ""}     # off | record | replay | readthrough — freeze one extraction, replay across ingest ablations

  compaction: {p_frame_trigger: 10, keep_recent: 5, separator: "\n---\n", temp_age_days: 30, deprecated_age_days: 90}
  contradiction: {enabled: true, model: deepseek-flash, top_k: 1}  # emits B-frames; top_k = candidate frames checked per observation

dspy:
  default_model: deepseek-flash
  adapter: chat
  # Hidden-reasoning policy for OpenRouter hybrid reasoning models: reasoning bills
  # 5-12x the visible output and eats max_tokens unpredictably, with no extraction-quality gain.
  # false -> send {reasoning: {enabled: false}} | true -> enable | null -> provider default.
  # Per-model override: models.<name>.extra.extra_body.reasoning always wins.
  reasoning_enabled: false
  track_usage: true
  cache: {disk: true, dir: ~/.gluomem/dspy_cache}
  tasks:
    # 4096: real LoCoMo sessions truncate at smaller caps.
    fact_extraction:  {model: deepseek-flash, module: predict, temperature: 0.0, max_tokens: 4096}
    # refine off by default: dspy.Refine forces temperature=1.0 per attempt (nondeterministic);
    # the JSONAdapter parse-failure fallback already retries at configured temp. Ablation flip.
    event_extraction: {model: deepseek-flash, module: predict, temperature: 0.0, refine: {enabled: false, N: 2}}
    cognify:          {model: deepseek-flash, module: predict}
    contradiction:    {model: deepseek-flash, module: predict, temperature: 0.0}   # cot = ablation flip
    # Benchmark answerer = the experiment SUBJECT; swap per run:
    # --override dspy.tasks.answer.model=sonnet5|gpt5-mini|qwen3|glm5.
    # NOT in TASK_SIGNATURES (optimize --task all skips it).
    answer:           {model: deepseek-flash, module: predict, temperature: 0.0, max_tokens: 1024}
  optimizer: {auto: light}
  artifacts: {dir: artifacts/dspy, require: false, pins: {}}   # task -> sha256 of program.pkl

tuning:
  k: 10
  n_trials: 20000
  seed: 42
  multi_fidelity: {min_resource: 0.1, max_resource: 1.0, reduction_factor: 3}
  top_n: 8
  ltr: {enabled: false, min_labeled_queries: 200}

benchmark:
  # Trio-strict = 3 independent families (Anthropic + OpenAI + open), unanimous
  # CORRECT; singles always recorded alongside to expose self-judge inflation.
  judge: {family: trio_strict, backbones: [haiku, gpt5-mini, qwen3], also_record_single: true, backend: dspy}
  # context_k 50: multi-hop questions scatter gold evidence across frames, so
  # top-10 is too narrow; k=50 is paired with search.rerank.pool=100.
  # Applies to every retriever that returns ranked memories.
  answer: {task: answer, backend: dspy, context_k: 50, abstain_text: "I don't know.", style: preference_aware}   # style: base | preference_aware
  retrieval: {ks: [5, 10]}                       # diagnostic cutoffs for precision/evidence metrics
  # Fixed sampling protocol (N=320 = 80 x 4 categories, seed 42) so runs stay directly comparable.
  sample: {per_category: 80, categories: [1, 2, 3, 4], seed: 42, manifest: benchmarks_data/locomo_sample_seed42.json}
  datasets:                                      # SHA-pinned sources (tamper-evident fetch/load)
    locomo:
      url: https://raw.githubusercontent.com/snap-research/locomo/main/data/locomo10.json
      sha256: 79fa87e90f04081343b8c8debecb80a9a6842b76a7aa537dc9fdf651ea698ff4
      file: locomo10.json
    longmemeval_oracle:                          # arXiv:2410.10813, evidence-only haystacks (ceiling variant)
      url: https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_oracle.json
      sha256: 821a2034d219ab45846873dd14c14f12cfe7776e73527a483f9dac095d38620c
      file: longmemeval_oracle.json
    longmemeval_s:                               # ~48 sessions/~115k tokens per question (primary variant)
      url: https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json
      sha256: d6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442
      file: longmemeval_s_cleaned.json
  datasets_dir: benchmarks_data
  full_context: {max_chars: 120000, keep: tail}  # keep: head | tail (tail = most recent sessions)
  run_dir: experiments
  parallelism: 8
  # Head-to-head baseline: mem0 OSS (base/vector; the graph variant needs neo4j — out of scope).
  # Same extraction backbone as gluomem for fairness; embedder = local MiniLM because
  # mem0's OpenAI-embeddings default needs a key we don't use (also matches gluomem's embedder).
  # top_k null -> benchmark.answer.context_k; infer=true = mem0's default extraction pipeline.
  mem0: {model: deepseek-flash, embedder_model: minilm, top_k: null, infer: true}
  # evidence_hit@5, not precision@5: LoCoMo evidence sets are 1-3 dia_ids, so
  # strict precision@5 caps at |evidence|/5 and a 0.7 floor could never pass.
  ci_gate: {metric: evidence_hit@5, min: 0.7}
